[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["sqlite-vec>=0.1.6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["secondbrain", "secondbrain.sources"]

[tool.setuptools.package-data]
secondbrain = ["schema.sql"]
